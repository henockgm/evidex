        Overrides carry over to new versions while the requirement's text is unchanged.
      parameters: []
      responses:
        '200':
          description: updated; returns the whole report
          content:
            application/json:
              schema:
                type: object
                required:
                - match_report
                properties:
                  match_report:
                    "$ref": "#/components/schemas/MatchReport"
        '422':
          description: invalid verdict
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: someone else's report
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requirement_match
              properties:
                requirement_match:
                  type: object
                  properties:
                    user_verdict:
                      type: string
                      enum:
                      - evidenced
                      - transferable
                      - gap
                      nullable: true
                    user_note:
                      type: string
                      nullable: true
                      maxLength: 2000
  "/api/v1/job_postings/{job_posting_id}/requirements":
    parameters:
    - name: job_posting_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Add a requirement to a posting
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '201':
          description: added at the end of its kind
          content:
            application/json:
              schema:
                type: object
                required:
                - requirement
                properties:
                  requirement:
                    "$ref": "#/components/schemas/Requirement"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: not one of your postings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requirement
              properties:
                requirement:
                  type: object
                  required:
                  - kind
                  - text
                  properties:
                    kind:
                      type: string
                      enum:
                      - required
                      - preferred
                      - responsibility
                    text:
                      type: string
                      maxLength: 1000
  "/api/v1/requirements/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Change a requirement's text
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                - requirement
                properties:
                  requirement:
                    "$ref": "#/components/schemas/Requirement"
        '404':
          description: someone else's requirement
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requirement
              properties:
                requirement:
                  type: object
                  required:
                  - text
                  properties:
                    text:
                      type: string
    delete:
      summary: Remove a requirement
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: removed
        '404':
          description: someone else's requirement
  "/api/v1/status":
    get:
      summary: Returns API and database status
      tags:
      - Status
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - api_version
                - environment
                - database
                - time
                properties:
                  name:
                    type: string
                    example: Evidex
                  api_version:
                    type: string
                    example: v1
                  environment:
                    type: string
                  database:
                    type: string
                    enum:
                    - ok
                    - error
                  time:
                    type: string
                    format: date-time
components:
  securitySchemes:
    session_cookie:
      type: apiKey
      in: cookie
      name: evidex_session
      description: Set by POST /api/v1/session or Google/Microsoft sign-in. HttpOnly.
    csrf_token:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on POST/PATCH/DELETE. Get it from GET /api/v1/csrf_token.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Message:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    Identity:
      type: object
      required:
      - id
      - provider
      - label
      - created_at
      properties:
        id:
          type: integer
        provider:
          type: string
          enum:
          - google_oauth2
          - entra_id
        label:
          type: string
          example: Google
        email:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required:
      - id
      - email_address
      - email_verified
      - has_password
      - ai_configured
      - two_factor_enabled
      - recovery_codes_remaining
      - identities
      - admin
      - created_at
      properties:
        id:
          type: integer
        email_address:
          type: string
          format: email
        name:
          type: string
          nullable: true
        email_verified:
          type: boolean
        has_password:
          type: boolean
        ai_configured:
          type: boolean
          description: The server has an AI provider configured
        two_factor_enabled:
          type: boolean
        recovery_codes_remaining:
          type: integer
        identities:
          type: array
          items:
            "$ref": "#/components/schemas/Identity"
        admin:
          type: boolean
          description: Can use the admin area (needs two-factor sign-in)
        created_at:
          type: string
          format: date-time
    AdminUser:
      type: object
      description: 'An account as admins see it: metadata only'
      required:
      - id
      - email_address
      - admin
      - email_verified
      - has_password
      - two_factor_enabled
      - providers
      - active_sessions
      - ai_calls_last_30_days
      - created_at
      properties:
        id:
          type: integer
        email_address:
          type: string
          format: email
        name:
          type: string
          nullable: true
        admin:
          type: boolean
        email_verified:
          type: boolean
        has_password:
          type: boolean
        two_factor_enabled:
          type: boolean
        providers:
          type: array
          items:
            type: string
            enum:
            - google_oauth2
            - entra_id
        locked_until:
          type: string
          format: date-time
          nullable: true
          description: Temporary lock after failed sign-ins
        suspended_at:
          type: string
          format: date-time
          nullable: true
          description: Locked by an admin until unlocked
        active_sessions:
          type: integer
        last_active_at:
          type: string
          format: date-time
          nullable: true
        ai_calls_last_30_days:
          type: integer
        created_at:
          type: string
          format: date-time
    AdminUserEnvelope:
      type: object
      required:
      - user
      properties:
        user:
          "$ref": "#/components/schemas/AdminUser"
    PageMeta:
      type: object
      required:
      - page
      - per_page
      - total
      - total_pages
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    UserEnvelope:
      type: object
      required:
      - user
      properties:
        user:
          "$ref": "#/components/schemas/User"
    JobPostingSummary:
      type: object
      required:
      - id
      - title
      - company
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        title:
          type: string
        company:
          type: string
        location:
          type: string
          nullable: true
        work_model:
          type: string
          enum:
          - onsite
          - hybrid
          - remote
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        source_url:
          type: string
          nullable: true
        status:
          "$ref": "#/components/schemas/ApplicationStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApplicationStatus:
      type: string
      enum:
      - saved
      - preparing
      - applied
      - interviewing
      - offer
      - accepted
      - rejected
      - no_response
      - withdrawn
      description: saved → preparing → applied → interviewing → offer, or rejected
        / withdrawn
    JobApplication:
      type: object
      required:
      - id
      - status
      - available_transitions
      - applied_on
      - next_action
      - next_action_on
      - notes
      - links
      - contacts
      - interviews
      - events
      properties:
        id:
          type: integer
        status:
          "$ref": "#/components/schemas/ApplicationStatus"
        applied_on:
          type: string
          format: date
          nullable: true
        next_action:
          type: string
          nullable: true
        next_action_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        links:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationLink"
        contacts:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationContact"
        interviews:
          type: array
          description: Oldest first
          items:
            "$ref": "#/components/schemas/Interview"
        available_transitions:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationStatus"
          description: Statuses this application can move to next
        events:
          type: array
          description: Timeline, oldest first
          items:
            type: object
            required:
            - id
            - to_status
            - created_at
            properties:
              id:
                type: integer
              from_status:
                allOf:
                - "$ref": "#/components/schemas/ApplicationStatus"
                nullable: true
              to_status:
                "$ref": "#/components/schemas/ApplicationStatus"
              note:
                type: string
                nullable: true
              created_at:
                type: string
                format: date-time
    MatchReport:
      type: object
      required:
      - id
      - job_posting_id
      - version
      - status
      - error
      - model
      - counts
      - strengths
      - gaps
      - created_at
      - completed_at
      - matches
      properties:
        id:
          type: integer
        job_posting_id:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum:
          - pending
          - running
          - done
          - failed
        error:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        counts:
          type: object
          required:
          - evidenced
          - transferable
          - gap
          properties:
            evidenced:
              type: integer
            transferable:
              type: integer
            gap:
              type: integer
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        matches:
          type: array
          items:
            "$ref": "#/components/schemas/RequirementMatch"
    RequirementMatch:
      type: object
      required:
      - id
      - requirement_id
      - requirement_kind
      - requirement_text
      - verdict
      - ai_verdict
      - user_verdict
      - user_note
      - reasoning
      - citations
      properties:
        id:
          type: integer
        requirement_id:
          type: integer
          nullable: true
          description: null once the requirement is deleted
        requirement_kind:
          type: string
          enum:
          - required
          - preferred
          - responsibility
        requirement_text:
          type: string
          description: As it was when the report ran
        verdict:
          type: string
          enum:
          - evidenced
          - transferable
          - gap
          description: The user's verdict if set, else the AI's
        ai_verdict:
          type: string
          enum:
          - evidenced
          - transferable
          - gap
        user_verdict:
          type: string
          enum:
          - evidenced
          - transferable
          - gap
          nullable: true
        user_note:
          type: string
          nullable: true
        reasoning:
          type: string
          nullable: true
        citations:
          type: array
          items:
            type: object
            required:
            - id
            - document_id
            - document_title
            - page
            - section
            - excerpt
            properties:
              id:
                type: integer
              document_id:
                type: integer
                nullable: true
              document_title:
                type: string
              page:
                type: integer
                nullable: true
              section:
                type: string
                nullable: true
              excerpt:
                type: string
                description: The cited passage, saved when the report ran
    Document:
      type: object
      required:
      - id
      - title
      - kind
      - primary
      - status
      - error
      - filename
      - content_type
      - byte_size
      - page_count
      - character_count
      - chunk_count
      - processed_at
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        title:
          type: string
        kind:
          type: string
          enum:
          - cv
          - project
          - certificate
          - reference
          - other
        primary:
          type: boolean
          description: The user's main CV
        status:
          type: string
          enum:
          - pending
          - processing
          - ready
          - failed
          description: Text extraction and indexing progress
        error:
          type: string
          nullable: true
        filename:
          type: string
        content_type:
          type: string
        byte_size:
          type: integer
        page_count:
          type: integer
          description: Pages of extracted text (1 for non-PDF files)
        character_count:
          type: integer
        chunk_count:
          type: integer
          description: Passages indexed for search and matching
        processed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Interview:
      type: object
      required:
      - id
      - round
      - scheduled_at
      - format
      - location
      - status
      - notes
      properties:
        id:
          type: integer
        round:
          type: string
          nullable: true
        scheduled_at:
          type: string
          format: date-time
        format:
          type: string
          enum:
          - video
          - phone
          - onsite
          - other
          nullable: true
        location:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - scheduled
          - completed
          - cancelled
        notes:
          type: string
          nullable: true
    ApplicationContact:
      type: object
      required:
      - id
      - name
      - role
      - email
      - phone
      - notes
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    ApplicationLink:
      type: object
      required:
      - url
      properties:
        label:
          type: string
          nullable: true
          maxLength: 100
        url:
          type: string
          format: uri
    JobApplicationInput:
      type: object
      properties:
        applied_on:
          type: string
          format: date
          nullable: true
        next_action:
          type: string
          nullable: true
          maxLength: 200
        next_action_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 20000
        links:
          type: array
          maxItems: 20
          items:
            "$ref": "#/components/schemas/ApplicationLink"
    Requirement:
      type: object
      required:
      - id
      - kind
      - text
      - position
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
          - required
          - preferred
          - responsibility
        text:
          type: string
        position:
          type: integer
          description: Order within its kind, starting at 1
    JobPosting:
      allOf:
      - "$ref": "#/components/schemas/JobPostingSummary"
      - type: object
        required:
        - description
        - requirements
        - application
        - employment_type
        - seniority
        - salary
        - keywords
        - extraction
        properties:
          description:
            type: string
          employment_type:
            type: string
            nullable: true
          seniority:
            type: string
            nullable: true
          salary:
            type: string
            nullable: true
            description: As stated in the ad
          keywords:
            type: array
            items:
              type: string
          extraction:
            type: object
            required:
            - status
            - error
            - extracted_at
            properties:
              status:
                type: string
                enum:
                - none
                - pending
                - done
                - failed
              error:
                type: string
                nullable: true
              extracted_at:
                type: string
                format: date-time
                nullable: true
          requirements:
            type: array
            items:
              "$ref": "#/components/schemas/Requirement"
          application:
            "$ref": "#/components/schemas/JobApplication"
    JobPostingEnvelope:
      type: object
      required:
      - job_posting
      properties:
        job_posting:
          "$ref": "#/components/schemas/JobPosting"
    JobPostingInput:
      type: object
      description: title, company and description are required when creating.
      properties:
        title:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
          nullable: true
        work_model:
          type: string
          enum:
          - onsite
          - hybrid
          - remote
          nullable: true
        employment_type:
          type: string
          maxLength: 200
          nullable: true
        seniority:
          type: string
          maxLength: 200
          nullable: true
        salary:
          type: string
          maxLength: 200
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        source_url:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          maxLength: 100000
          description: The posting text
    AuditEvent:
      type: object
      required:
      - id
      - action
      - created_at
      - details
      properties:
        id:
          type: integer
        action:
          type: string
          enum:
          - registered
          - registration_duplicate
          - signed_in
          - sign_in_failed
          - account_locked
          - signed_out
          - session_revoked
          - other_sessions_revoked
          - email_verified
          - password_reset_requested
          - password_reset
          - password_changed
          - identity_linked
          - identity_unlinked
          - oauth_signed_in
          - second_factor_failed
          - two_factor_enabled
          - two_factor_disabled
          - recovery_codes_regenerated
          - reauthenticated
          - reauthentication_failed
          - admin_locked
          - admin_unlocked
          - admin_signed_out
        created_at:
          type: string
          format: date-time
        ip_address:
          type: string
          nullable: true
        device:
          type: string
          nullable: true
          description: Browser and system, e.g. "Chrome on macOS"
        details:
          type: object
          properties:
            provider:
              type: string
            method:
              type: string
            second_factor:
              type: string
              enum:
              - authenticator
              - recovery_code
            until:
              type: string
              format: date-time
              description: End of an account lock
    Session:
      type: object
      required:
      - id
      - current
      - created_at
      - last_active_at
      properties:
        id:
          type: integer
        current:
          type: boolean
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
servers:
- url: http://localhost:3000
  description: Local development
