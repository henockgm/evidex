# Deploys Evidex with Kamal to one server (Hetzner CAX11, Arm): the app plus
# Postgres with pgvector as an accessory on the same machine. kamal-proxy
# terminates HTTPS with a Let's Encrypt certificate.
#
# Server address, domain and secrets come from .env.production (git-ignored,
# see .env.example), so none of them end up in this public repository.
<% require "dotenv"; Dotenv.load(".env.production") %>

service: evidex
image: evidex

servers:
  web:
    - <%= ENV.fetch("EVIDEX_SERVER_IP") %>

proxy:
  ssl: true
  host: <%= ENV.fetch("EVIDEX_DOMAIN") %>
  # Thruster in the image listens on 80
  app_port: 80
  healthcheck:
    path: /up

# Kamal pushes the image through a registry it runs locally and tunnels over SSH,
# so no Docker Hub or GHCR account is needed.
registry:
  server: localhost:5555

builder:
  # Same as the Mac building it and the CAX11 running it
  arch: arm64

# The key made for this server (~/.ssh/evidex_hetzner); it must be in the SSH agent
ssh:
  keys_only: true
  keys:
    - ~/.ssh/evidex_hetzner

env:
  clear:
    APP_URL: https://<%= ENV.fetch("EVIDEX_DOMAIN") %>
    EVIDEX_DATABASE_HOST: evidex-db
    RAILS_LOG_LEVEL: info
    # Brevo's SMTP relay (see lib/evidex/smtp_settings.rb)
    SMTP_ADDRESS: <%= ENV.fetch("SMTP_ADDRESS", "smtp-relay.brevo.com") %>
    SMTP_PORT: <%= ENV.fetch("SMTP_PORT", "587") %>
    MAILER_FROM: <%= ENV.fetch("MAILER_FROM").to_json %>
  secret:
    - RAILS_MASTER_KEY
    - EVIDEX_DATABASE_PASSWORD
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    - ANTHROPIC_API_KEY
    - SMTP_USERNAME
    - SMTP_PASSWORD

# Uploaded documents (Active Storage, local disk)
volumes:
  - "evidex_storage:/rails/storage"

accessories:
  db:
    image: pgvector/pgvector:pg17
    host: <%= ENV.fetch("EVIDEX_SERVER_IP") %>
    # Only reachable from the server itself; the app connects over Kamal's Docker network
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: evidex
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
