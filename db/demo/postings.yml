# Fictional companies and ads. Dates are relative to the day of the reset.
# The first posting gets the saved match report (match_report.yml).
- title: Senior Ruby on Rails Developer
  company: Polar Freight Oy
  location: Tampere, Finland
  work_model: hybrid
  employment_type: Full-time
  seniority: Senior
  deadline_in_days: 12
  source_url: https://jobs.example.com/polar-freight/senior-rails-developer
  keywords: [Ruby on Rails, PostgreSQL, Sidekiq, Kubernetes, AWS]
  description: |
    Polar Freight moves pallets across the Nordics, and our booking platform is a Ruby on Rails
    monolith that we are slowly splitting into services. We are looking for a senior developer to
    help us get there safely.

    What you'll do
    - Design and build APIs for booking, pricing and tracking
    - Move long-running work into background jobs and make it reliable
    - Mentor two junior developers and review their code
    - Take part in on-call for the systems you build

    What we're looking for
    - 5+ years of professional Ruby on Rails experience
    - Strong PostgreSQL skills, including query tuning
    - Experience with background job systems such as Sidekiq
    - Experience running services on Kubernetes
    - Good written English; Finnish is a plus

    Nice to have
    - AWS experience
    - Event-driven architecture or message queues
  requirements:
    required:
      - 5+ years of professional Ruby on Rails experience
      - Strong PostgreSQL skills, including query tuning
      - Experience with background job systems such as Sidekiq
      - Experience running services on Kubernetes
      - Good written English
    preferred:
      - Finnish language skills
      - AWS experience
      - Event-driven architecture or message queues
    responsibility:
      - Design and build APIs for booking, pricing and tracking
      - Mentor junior developers and review their code
  application:
    statuses: [applied, interviewing]
    applied_days_ago: 9
    next_action: Prepare system design examples for the technical interview
    next_action_in_days: 2
    notes: Recruiter mentioned the team is moving from Heroku to Kubernetes this year.
    contacts:
      - name: Maria Sample
        role: Recruiter
        email: maria.sample@example.com
    interviews:
      - round: Technical interview
        in_days: 3
        format: video
        location: Video call
