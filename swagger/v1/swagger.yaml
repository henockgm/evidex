---
openapi: 3.0.1
info:
  title: Evidex API
  version: v1
  description: 'Evidence-based job applications: postings, career library, match reports
    and application tracking.'
paths:
  "/api/v1/me":
    get:
      summary: Current user
      tags:
      - Account
      security:
      - session_cookie: []
      responses:
        '200':
          description: signed-in user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
    delete:
      summary: Delete the account and all its data
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '204':
          description: deleted
        '422':
          description: confirmation failed
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Required when the account has a password
                confirm_email:
                  type: string
                  description: Required instead of password for Google/Microsoft-only
                    accounts
  "/api/v1/me/password":
    patch:
      summary: Change password (or add one to a Google/Microsoft-only account)
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Signs out all other sessions. Accounts without a password must
        have signed in within the last 10 minutes.
      parameters: []
      responses:
        '200':
          description: changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '422':
          description: wrong current password or invalid new password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 12
  "/api/v1/me/sessions":
    get:
      summary: List signed-in devices
      tags:
      - Account
      security:
      - session_cookie: []
      responses:
        '200':
          description: sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                properties:
                  sessions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Session"
  "/api/v1/me/sessions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Sign out one device
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: revoked
        '404':
          description: not one of your sessions
  "/api/v1/me/sessions/others":
    delete:
      summary: Sign out all other devices
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: revoked
  "/api/v1/me/identities":
    get:
      summary: List connected Google/Microsoft accounts
      tags:
      - Account
      security:
      - session_cookie: []
      responses:
        '200':
          description: identities
          content:
            application/json:
              schema:
                type: object
                required:
                - identities
                properties:
                  identities:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Identity"
  "/api/v1/me/identities/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Disconnect a Google/Microsoft account
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Refused when it is the account's only sign-in method.
      responses:
        '204':
          description: disconnected
  "/api/v1/job_applications/{job_application_id}/contacts":
    parameters:
    - name: job_application_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Add a contact to an application
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '201':
          description: added
          content:
            application/json:
              schema:
                type: object
                required:
                - contact
                properties:
                  contact:
                    "$ref": "#/components/schemas/ApplicationContact"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: someone else's application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              properties:
                contact:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    role:
                      type: string
                      nullable: true
                      maxLength: 100
                    email:
                      type: string
                      format: email
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                      maxLength: 40
                    notes:
                      type: string
                      nullable: true
                      maxLength: 2000
                  required:
                  - name
  "/api/v1/contacts/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Update a contact
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                - contact
                properties:
                  contact:
                    "$ref": "#/components/schemas/ApplicationContact"
        '404':
          description: someone else's contact
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              properties:
                contact:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    role:
                      type: string
                      nullable: true
                      maxLength: 100
                    email:
                      type: string
                      format: email
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                      maxLength: 40
                    notes:
                      type: string
                      nullable: true
                      maxLength: 2000
    delete:
      summary: Remove a contact
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: removed
        '404':
          description: someone else's contact
  "/api/v1/csrf_token":
    get:
      summary: Get a CSRF token for state-changing requests
      tags:
      - Authentication
      responses:
        '200':
          description: token issued
          content:
            application/json:
              schema:
                type: object
                required:
                - csrf_token
                properties:
                  csrf_token:
                    type: string
  "/api/v1/auth/providers":
    get:
      summary: List enabled Google/Microsoft sign-in providers
      tags:
      - Authentication
      description: Start a provider sign-in with a browser form POST to `path` that
        includes `authenticity_token`.
      responses:
        '200':
          description: providers
          content:
            application/json:
              schema:
                type: object
                required:
                - providers
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - label
                      - path
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        path:
                          type: string
  "/api/v1/registration":
    post:
      summary: Register with email and password
      tags:
      - Authentication
      security:
      - csrf_token: []
      description: Always 202 for a well-formed request, whether or not the email
        is already registered.
      parameters: []
      responses:
        '202':
          description: confirmation email sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '422':
          description: invalid password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email_address
              - password
              properties:
                email_address:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  description: 12+ characters, max 72 bytes, not in a known breach
                name:
                  type: string
                  maxLength: 100
  "/api/v1/session":
    post:
      summary: Sign in with email and password
      tags:
      - Authentication
      security:
      - csrf_token: []
      parameters: []
      responses:
        '201':
          description: signed in; sets the session cookie
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '401':
          description: invalid credentials or locked account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email_address
              - password
              properties:
                email_address:
                  type: string
                  format: email
                password:
                  type: string
    delete:
      summary: Sign out
      tags:
      - Authentication
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: signed out
  "/api/v1/email_verification":
    post:
      summary: Confirm an email address with the emailed token
      tags:
      - Authentication
      security:
      - csrf_token: []
      parameters: []
      responses:
        '200':
          description: confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '422':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
  "/api/v1/email_verification/resend":
    post:
      summary: Resend the confirmation email
      tags:
      - Authentication
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '202':
          description: sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
  "/api/v1/password_reset":
    post:
      summary: Request a password reset email
      tags:
      - Authentication
      security:
      - csrf_token: []
      description: Always 202, whether or not the account exists.
      parameters: []
      responses:
        '202':
          description: email sent if the account exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email_address
              properties:
                email_address:
                  type: string
    patch:
      summary: Set a new password with the emailed token
      tags:
      - Authentication
      security:
      - csrf_token: []
      parameters: []
      responses:
        '200':
          description: password reset; all sessions signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '422':
          description: invalid token or password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
  "/api/v1/job_applications/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Update application details
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      description: Send only the fields to change. `links` replaces the whole list;
        send [] to clear it.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                - application
                properties:
                  application:
                    "$ref": "#/components/schemas/JobApplication"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: someone else's application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - job_application
              properties:
                job_application:
                  "$ref": "#/components/schemas/JobApplicationInput"
  "/api/v1/job_applications/{id}/transitions":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Move an application to a new status
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      description: Allowed next statuses are listed in the application's available_transitions.
      parameters: []
      responses:
        '200':
          description: moved; returns the application with its timeline
          content:
            application/json:
              schema:
                type: object
                required:
                - application
                properties:
                  application:
                    "$ref": "#/components/schemas/JobApplication"
        '422':
          description: not allowed from the current status
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: someone else's application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - to_status
              properties:
                to_status:
                  "$ref": "#/components/schemas/ApplicationStatus"
                note:
                  type: string
                  maxLength: 2000
                  description: Optional, shown in the timeline
  "/api/v1/job_posting_import":
    post:
      summary: Fetch a job ad from a link and return a draft posting
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      description: |
        Nothing is saved. Review the draft, then create it with POST /api/v1/job_postings.
        Only public http(s) pages are fetched; internal addresses, other ports and non-HTML files are refused.
      parameters: []
      responses:
        '200':
          description: draft
          content:
            application/json:
              schema:
                type: object
                required:
                - draft
                - structured_data
                properties:
                  draft:
                    "$ref": "#/components/schemas/JobPostingInput"
                  structured_data:
                    type: boolean
                    description: The page had schema.org JobPosting data
        '422':
          description: couldn't fetch or refused
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
  "/api/v1/job_postings":
    get:
      summary: List, filter and search your job postings
      tags:
      - Job postings
      security:
      - session_cookie: []
      parameters:
      - name: status
        in: query
        required: false
        description: Comma-separated statuses, e.g. applied,interviewing
        schema:
          type: string
      - name: q
        in: query
        required: false
        description: Words to find in title, company or location
        schema:
          type: string
      - name: deadline
        in: query
        required: false
        schema:
          type: string
          enum:
          - upcoming
          - overdue
          - none
        description: upcoming = within 7 days
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - newest
          - oldest
          - deadline
          - company
          - next_action
          - updated
          default: newest
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: filtered
          content:
            application/json:
              schema:
                type: object
                required:
                - job_postings
                - meta
                properties:
                  job_postings:
                    type: array
                    items:
                      "$ref": "#/components/schemas/JobPostingSummary"
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total
                    - total_pages
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
    post:
      summary: Add a job posting from pasted text
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JobPostingEnvelope"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - job_posting
              properties:
                job_posting:
                  "$ref": "#/components/schemas/JobPostingInput"
  "/api/v1/job_postings/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show a job posting with its full text
      tags:
      - Job postings
      security:
      - session_cookie: []
      responses:
        '200':
          description: posting
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JobPostingEnvelope"
        '404':
          description: not one of your postings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
    patch:
      summary: Update a job posting
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      description: Send only the fields to change.
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/JobPostingEnvelope"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: not one of your postings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - job_posting
              properties:
                job_posting:
                  "$ref": "#/components/schemas/JobPostingInput"
    delete:
      summary: Delete a job posting
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: deleted
        '404':
          description: not one of your postings
  "/api/v1/job_postings/{job_posting_id}/requirements":
    parameters:
    - name: job_posting_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Add a requirement to a posting
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '201':
          description: added at the end of its kind
          content:
            application/json:
              schema:
                type: object
                required:
                - requirement
                properties:
                  requirement:
                    "$ref": "#/components/schemas/Requirement"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: not one of your postings
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requirement
              properties:
                requirement:
                  type: object
                  required:
                  - kind
                  - text
                  properties:
                    kind:
                      type: string
                      enum:
                      - required
                      - preferred
                      - responsibility
                    text:
                      type: string
                      maxLength: 1000
  "/api/v1/requirements/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Change a requirement's text
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                - requirement
                properties:
                  requirement:
                    "$ref": "#/components/schemas/Requirement"
        '404':
          description: someone else's requirement
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - requirement
              properties:
                requirement:
                  type: object
                  required:
                  - text
                  properties:
                    text:
                      type: string
    delete:
      summary: Remove a requirement
      tags:
      - Job postings
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: removed
        '404':
          description: someone else's requirement
  "/api/v1/status":
    get:
      summary: Returns API and database status
      tags:
      - Status
      responses:
        '200':
          description: API is up
          content:
            application/json:
              schema:
                type: object
                required:
                - name
                - api_version
                - environment
                - database
                - time
                properties:
                  name:
                    type: string
                    example: Evidex
                  api_version:
                    type: string
                    example: v1
                  environment:
                    type: string
                  database:
                    type: string
                    enum:
                    - ok
                    - error
                  time:
                    type: string
                    format: date-time
components:
  securitySchemes:
    session_cookie:
      type: apiKey
      in: cookie
      name: evidex_session
      description: Set by POST /api/v1/session or Google/Microsoft sign-in. HttpOnly.
    csrf_token:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Required on POST/PATCH/DELETE. Get it from GET /api/v1/csrf_token.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    Message:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    Identity:
      type: object
      required:
      - id
      - provider
      - label
      - created_at
      properties:
        id:
          type: integer
        provider:
          type: string
          enum:
          - google_oauth2
          - entra_id
        label:
          type: string
          example: Google
        email:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    User:
      type: object
      required:
      - id
      - email_address
      - email_verified
      - has_password
      - identities
      - created_at
      properties:
        id:
          type: integer
        email_address:
          type: string
          format: email
        name:
          type: string
          nullable: true
        email_verified:
          type: boolean
        has_password:
          type: boolean
        identities:
          type: array
          items:
            "$ref": "#/components/schemas/Identity"
        created_at:
          type: string
          format: date-time
    UserEnvelope:
      type: object
      required:
      - user
      properties:
        user:
          "$ref": "#/components/schemas/User"
    JobPostingSummary:
      type: object
      required:
      - id
      - title
      - company
      - status
      - created_at
      - updated_at
      properties:
        id:
          type: integer
        title:
          type: string
        company:
          type: string
        location:
          type: string
          nullable: true
        work_model:
          type: string
          enum:
          - onsite
          - hybrid
          - remote
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        source_url:
          type: string
          nullable: true
        status:
          "$ref": "#/components/schemas/ApplicationStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApplicationStatus:
      type: string
      enum:
      - saved
      - preparing
      - applied
      - interviewing
      - offer
      - rejected
      - withdrawn
      description: saved → preparing → applied → interviewing → offer, or rejected
        / withdrawn
    JobApplication:
      type: object
      required:
      - id
      - status
      - available_transitions
      - applied_on
      - next_action
      - next_action_on
      - notes
      - links
      - contacts
      - events
      properties:
        id:
          type: integer
        status:
          "$ref": "#/components/schemas/ApplicationStatus"
        applied_on:
          type: string
          format: date
          nullable: true
        next_action:
          type: string
          nullable: true
        next_action_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        links:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationLink"
        contacts:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationContact"
        available_transitions:
          type: array
          items:
            "$ref": "#/components/schemas/ApplicationStatus"
          description: Statuses this application can move to next
        events:
          type: array
          description: Timeline, oldest first
          items:
            type: object
            required:
            - id
            - to_status
            - created_at
            properties:
              id:
                type: integer
              from_status:
                allOf:
                - "$ref": "#/components/schemas/ApplicationStatus"
                nullable: true
              to_status:
                "$ref": "#/components/schemas/ApplicationStatus"
              note:
                type: string
                nullable: true
              created_at:
                type: string
                format: date-time
    ApplicationContact:
      type: object
      required:
      - id
      - name
      - role
      - email
      - phone
      - notes
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
    ApplicationLink:
      type: object
      required:
      - url
      properties:
        label:
          type: string
          nullable: true
          maxLength: 100
        url:
          type: string
          format: uri
    JobApplicationInput:
      type: object
      properties:
        applied_on:
          type: string
          format: date
          nullable: true
        next_action:
          type: string
          nullable: true
          maxLength: 200
        next_action_on:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
          maxLength: 20000
        links:
          type: array
          maxItems: 20
          items:
            "$ref": "#/components/schemas/ApplicationLink"
    Requirement:
      type: object
      required:
      - id
      - kind
      - text
      - position
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
          - required
          - preferred
          - responsibility
        text:
          type: string
        position:
          type: integer
          description: Order within its kind, starting at 1
    JobPosting:
      allOf:
      - "$ref": "#/components/schemas/JobPostingSummary"
      - type: object
        required:
        - description
        - requirements
        - application
        properties:
          description:
            type: string
          requirements:
            type: array
            items:
              "$ref": "#/components/schemas/Requirement"
          application:
            "$ref": "#/components/schemas/JobApplication"
    JobPostingEnvelope:
      type: object
      required:
      - job_posting
      properties:
        job_posting:
          "$ref": "#/components/schemas/JobPosting"
    JobPostingInput:
      type: object
      description: title, company and description are required when creating.
      properties:
        title:
          type: string
          maxLength: 200
        company:
          type: string
          maxLength: 200
        location:
          type: string
          maxLength: 200
          nullable: true
        work_model:
          type: string
          enum:
          - onsite
          - hybrid
          - remote
          nullable: true
        deadline:
          type: string
          format: date
          nullable: true
        source_url:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          maxLength: 100000
          description: The posting text
    Session:
      type: object
      required:
      - id
      - current
      - created_at
      - last_active_at
      properties:
        id:
          type: integer
        current:
          type: boolean
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
servers:
- url: http://localhost:3000
  description: Local development
