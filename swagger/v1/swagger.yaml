---
openapi: 3.0.1
info:
  title: Evidex API
  version: v1
  description: 'Evidence-based job applications: postings, career library, match reports
    and application tracking.'
paths:
  "/api/v1/me":
    get:
      summary: Current user
      tags:
      - Account
      security:
      - session_cookie: []
      responses:
        '200':
          description: signed-in user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '401':
          description: not signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
    delete:
      summary: Delete the account and all its data
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Needs a sign-in or re-authentication (POST /api/v1/me/reauthentication)
        from the last 10 minutes; otherwise 403 with type urn:evidex:problem:reauthentication-required.
      parameters: []
      responses:
        '204':
          description: deleted
        '403':
          description: re-authentication needed
        '422':
          description: email doesn't match
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - confirm_email
              properties:
                confirm_email:
                  type: string
                  description: The account's email address, typed out
  "/api/v1/me/password":
    patch:
      summary: Change password (or add one to a Google/Microsoft-only account)
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Signs out all other sessions. Needs a sign-in or re-authentication
        (POST /api/v1/me/reauthentication) from the last 10 minutes; otherwise 403
        with type urn:evidex:problem:reauthentication-required.
      parameters: []
      responses:
        '200':
          description: changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '422':
          description: invalid new password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                  minLength: 12
  "/api/v1/me/reauthentication":
    post:
      summary: Confirm it's you before a sensitive change (sudo mode)
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Asks for the password, plus a code when two-factor sign-in is on.
        Accounts without a password give a code, or sign in with Google/Microsoft
        again. Sensitive changes are then allowed for 10 minutes.
      parameters: []
      responses:
        '201':
          description: confirmed
          content:
            application/json:
              schema:
                type: object
                required:
                - recently_authenticated_until
                properties:
                  recently_authenticated_until:
                    type: string
                    format: date-time
        '422':
          description: wrong password or code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Required when the account has a password
                code:
                  type: string
                  description: Authenticator or recovery code; required when two-factor
                    sign-in is on
  "/api/v1/me/two_factor/setup":
    post:
      summary: Start setting up two-factor sign-in
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Returns a new secret as a QR code; nothing changes until it is
        confirmed with POST /api/v1/me/two_factor. Needs a sign-in or re-authentication
        (POST /api/v1/me/reauthentication) from the last 10 minutes; otherwise 403
        with type urn:evidex:problem:reauthentication-required.
      responses:
        '200':
          description: secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required:
                - secret
                - otpauth_uri
                - qr_code
                properties:
                  secret:
                    type: string
                  otpauth_uri:
                    type: string
                  qr_code:
                    type: string
                    description: 'SVG as a data: URL'
  "/api/v1/me/two_factor":
    post:
      summary: Turn on two-factor sign-in by confirming a code
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '201':
          description: on; the recovery codes are shown only now
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - recovery_codes
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                  recovery_codes:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
    delete:
      summary: Turn off two-factor sign-in
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Needs a sign-in or re-authentication (POST /api/v1/me/reauthentication)
        from the last 10 minutes; otherwise 403 with type urn:evidex:problem:reauthentication-required.
      responses:
        '200':
          description: 'off'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
  "/api/v1/me/two_factor/recovery_codes":
    post:
      summary: Replace the recovery codes
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Needs a sign-in or re-authentication (POST /api/v1/me/reauthentication)
        from the last 10 minutes; otherwise 403 with type urn:evidex:problem:reauthentication-required.
      responses:
        '200':
          description: new codes; the old ones stop working
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                - recovery_codes
                properties:
                  user:
                    "$ref": "#/components/schemas/User"
                  recovery_codes:
                    type: array
                    items:
                      type: string
  "/api/v1/me/activity":
    get:
      summary: Security activity on the account, newest first
      tags:
      - Account
      security:
      - session_cookie: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: events and paging info (20 per page)
          content:
            application/json:
              schema:
                type: object
                required:
                - events
                - meta
                properties:
                  events:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AuditEvent"
                  meta:
                    type: object
                    required:
                    - page
                    - per_page
                    - total
                    - total_pages
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
  "/api/v1/me/sessions":
    get:
      summary: List signed-in devices
      tags:
      - Account
      security:
      - session_cookie: []
      responses:
        '200':
          description: sessions
          content:
            application/json:
              schema:
                type: object
                required:
                - sessions
                properties:
                  sessions:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Session"
  "/api/v1/me/sessions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Sign out one device
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: revoked
        '404':
          description: not one of your sessions
  "/api/v1/me/sessions/others":
    delete:
      summary: Sign out all other devices
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: revoked
  "/api/v1/me/identities":
    get:
      summary: List connected Google/Microsoft accounts
      tags:
      - Account
      security:
      - session_cookie: []
      responses:
        '200':
          description: identities
          content:
            application/json:
              schema:
                type: object
                required:
                - identities
                properties:
                  identities:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Identity"
  "/api/v1/me/identities/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Disconnect a Google/Microsoft account
      tags:
      - Account
      security:
      - session_cookie: []
        csrf_token: []
      description: Refused when it is the account's only sign-in method. Needs a sign-in
        or re-authentication (POST /api/v1/me/reauthentication) from the last 10 minutes;
        otherwise 403 with type urn:evidex:problem:reauthentication-required.
      responses:
        '204':
          description: disconnected
  "/api/v1/admin/overview":
    get:
      summary: Instance overview (admins only)
      tags:
      - Admin
      security:
      - session_cookie: []
      description: Admin endpoints answer 404 to non-admins, and 403 with type urn:evidex:problem:two-factor-required
        to admins without two-factor sign-in.
      responses:
        '200':
          description: headline numbers
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                - verified_users
                - two_factor_users
                - active_sessions
                - ai_calls_last_30_days
                properties:
                  users:
                    type: integer
                  verified_users:
                    type: integer
                  two_factor_users:
                    type: integer
                  active_sessions:
                    type: integer
                  ai_calls_last_30_days:
                    type: integer
        '404':
          description: not an admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/admin/users":
    get:
      summary: List accounts (admins only)
      tags:
      - Admin
      security:
      - session_cookie: []
      description: Account metadata only, newest first, 25 per page. Never documents,
        postings, reports or letters.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Part of an email address or name
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: accounts
          content:
            application/json:
              schema:
                type: object
                required:
                - users
                - meta
                properties:
                  users:
                    type: array
                    items:
                      "$ref": "#/components/schemas/AdminUser"
                  meta:
                    "$ref": "#/components/schemas/PageMeta"
  "/api/v1/admin/users/{user_id}/lock":
    parameters:
    - name: user_id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: Lock an account (admins only)
      tags:
      - Admin
      security:
      - session_cookie: []
        csrf_token: []
      description: Signs the account out everywhere, blocks every sign-in until unlocked
        and emails the user. Needs a recent sign-in (403 urn:evidex:problem:reauthentication-required).
      responses:
        '200':
          description: locked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUserEnvelope"
        '422':
          description: own account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
    delete:
      summary: Unlock an account (admins only)
      tags:
      - Admin
      security:
      - session_cookie: []
        csrf_token: []
      description: Lifts an admin lock and any temporary lock after failed sign-ins.
        Needs a recent sign-in.
      responses:
        '200':
          description: unlocked
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUserEnvelope"
  "/api/v1/admin/users/{user_id}/sign_out":
    parameters:
    - name: user_id
      in: path
      schema:
        type: integer
      required: true
    post:
      summary: Sign an account out on every device (admins only)
      tags:
      - Admin
      security:
      - session_cookie: []
        csrf_token: []
      description: Ends every session; the user can sign in again. Needs a recent
        sign-in.
      responses:
        '200':
          description: signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AdminUserEnvelope"
        '403':
          description: re-authentication needed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/v1/job_applications/{job_application_id}/contacts":
    parameters:
    - name: job_application_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Add a contact to an application
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '201':
          description: added
          content:
            application/json:
              schema:
                type: object
                required:
                - contact
                properties:
                  contact:
                    "$ref": "#/components/schemas/ApplicationContact"
        '422':
          description: invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: someone else's application
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              properties:
                contact:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    role:
                      type: string
                      nullable: true
                      maxLength: 100
                    email:
                      type: string
                      format: email
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                      maxLength: 40
                    notes:
                      type: string
                      nullable: true
                      maxLength: 2000
                  required:
                  - name
  "/api/v1/contacts/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Update a contact
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      parameters: []
      responses:
        '200':
          description: updated
          content:
            application/json:
              schema:
                type: object
                required:
                - contact
                properties:
                  contact:
                    "$ref": "#/components/schemas/ApplicationContact"
        '404':
          description: someone else's contact
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contact
              properties:
                contact:
                  type: object
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    role:
                      type: string
                      nullable: true
                      maxLength: 100
                    email:
                      type: string
                      format: email
                      nullable: true
                    phone:
                      type: string
                      nullable: true
                      maxLength: 40
                    notes:
                      type: string
                      nullable: true
                      maxLength: 2000
    delete:
      summary: Remove a contact
      tags:
      - Applications
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: removed
        '404':
          description: someone else's contact
  "/api/v1/csrf_token":
    get:
      summary: Get a CSRF token for state-changing requests
      tags:
      - Authentication
      responses:
        '200':
          description: token issued
          content:
            application/json:
              schema:
                type: object
                required:
                - csrf_token
                properties:
                  csrf_token:
                    type: string
  "/api/v1/auth/providers":
    get:
      summary: List enabled Google/Microsoft sign-in providers
      tags:
      - Authentication
      description: Start a provider sign-in with a browser form POST to `path` that
        includes `authenticity_token`. A signed-in user without a password or two-factor
        sign-in posts to `reauthenticate_path` instead to confirm it's them.
      responses:
        '200':
          description: providers
          content:
            application/json:
              schema:
                type: object
                required:
                - providers
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - label
                      - path
                      - reauthenticate_path
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        path:
                          type: string
                        reauthenticate_path:
                          type: string
  "/api/v1/registration":
    post:
      summary: Register with email and password
      tags:
      - Authentication
      security:
      - csrf_token: []
      description: Always 202 for a well-formed request, whether or not the email
        is already registered.
      parameters: []
      responses:
        '202':
          description: confirmation email sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '422':
          description: invalid password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email_address
              - password
              properties:
                email_address:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                  description: 12+ characters, max 72 bytes, not in a known breach
                name:
                  type: string
                  maxLength: 100
  "/api/v1/session":
    post:
      summary: Sign in with email and password
      tags:
      - Authentication
      security:
      - csrf_token: []
      parameters: []
      responses:
        '201':
          description: signed in; sets the session cookie
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '202':
          description: password accepted; a second factor is required
          content:
            application/json:
              schema:
                type: object
                required:
                - second_factor_required
                properties:
                  second_factor_required:
                    type: boolean
        '401':
          description: invalid credentials or locked account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email_address
              - password
              properties:
                email_address:
                  type: string
                  format: email
                password:
                  type: string
    delete:
      summary: Sign out
      tags:
      - Authentication
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '204':
          description: signed out
  "/api/v1/session/second_factor":
    post:
      summary: 'Second sign-in step: an authenticator or recovery code'
      tags:
      - Authentication
      security:
      - csrf_token: []
      description: Follows a 202 from POST /api/v1/session (or a Google/Microsoft
        redirect to /login/verify). Valid for 5 minutes and 5 attempts; wrong codes
        count toward account lockout.
      parameters: []
      responses:
        '201':
          description: signed in
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserEnvelope"
        '422':
          description: wrong code
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: 6-digit code or a recovery code
  "/api/v1/email_verification":
    post:
      summary: Confirm an email address with the emailed token
      tags:
      - Authentication
      security:
      - csrf_token: []
      parameters: []
      responses:
        '200':
          description: confirmed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '422':
          description: invalid or expired token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
  "/api/v1/email_verification/resend":
    post:
      summary: Resend the confirmation email
      tags:
      - Authentication
      security:
      - session_cookie: []
        csrf_token: []
      responses:
        '202':
          description: sent
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
  "/api/v1/password_reset":
    post:
      summary: Request a password reset email
      tags:
      - Authentication
      security:
      - csrf_token: []
      description: Always 202, whether or not the account exists.
      parameters: []
      responses:
        '202':
          description: email sent if the account exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email_address
              properties:
                email_address:
                  type: string
    patch:
      summary: Set a new password with the emailed token
      tags:
      - Authentication
      security:
      - csrf_token: []
      parameters: []
      responses:
        '200':
          description: password reset; all sessions signed out
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Message"
        '422':
          description: invalid token or password
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - password
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
  "/api/v1/dashboard":
    get:
      summary: Counts per status, upcoming deadlines, next actions and recent activity
      tags:
      - Applications
      security:
      - session_cookie: []
      responses:
        '200':
          description: dashboard
          content:
            application/json:
              schema:
                type: object
                required:
                - status_counts
                - total
                - upcoming_interviews
                - upcoming_deadlines
                - next_actions
                - no_reply
                - recent_activity
                properties:
                  status_counts:
                    type: object
                    required:
                    - saved
                    - preparing
                    - applied
                    - interviewing
                    - offer
                    - accepted
                    - rejected
                    - no_response
                    - withdrawn
                    properties:
                      saved:
                        type: integer
                      preparing:
                        type: integer
                      applied:
                        type: integer
                      interviewing:
                        type: integer
                      offer:
                        type: integer
                      accepted:
                        type: integer
                      rejected:
                        type: integer
                      no_response:
                        type: integer
                      withdrawn:
                        type: integer
                  total:
                    type: integer
                  upcoming_interviews:
                    type: array
                    description: Scheduled within 14 days
                    items:
                      type: object
                      required:
                      - job_posting_id
                      - title
                      - company
                      - interview_id
                      - round
                      - format
                      - scheduled_at
                      properties:
                        job_posting_id:
                          type: integer
                        title:
                          type: string
                        company:
                          type: string
                        interview_id:
                          type: integer
                        round:
                          type: string
                          nullable: true
                        format:
                          type: string
                          nullable: true
                        scheduled_at:
                          type: string
                          format: date-time
                  upcoming_deadlines:
                    type: array
                    description: Not applied yet, deadline within 14 days
                    items:
                      type: object
                      required:
                      - job_posting_id
                      - title
                      - company
                      - deadline
                      properties:
                        job_posting_id:
                          type: integer
                        title:
                          type: string
                        company:
                          type: string
                        deadline:
                          type: string
                          format: date
                  next_actions:
                    type: array
                    description: Due within 7 days, overdue included
                    items:
                      type: object
                      required:
                      - job_posting_id
                      - title
                      - company
                      - next_action
                      - next_action_on
                      - overdue
                      properties:
                        job_posting_id:
                          type: integer
                        title:
                          type: string
                        company:
                          type: string
                        next_action:
